# Example config for the production pair.
# Copy to ~/.config/rffmpeg/config.toml, or point RRFFMPEG_CONFIG at it.
#
# Without this file rrffmpeg runs the local ffmpeg and does nothing else.

# Jellyfin on some builds reads probe output on stdout.
stderr_as_stdout = false

# Shared secret of the agent daemon. Set it only if a host uses agent_addr.
# RRFFMPEG_AGENT_TOKEN overrides it, which keeps the secret out of this file.
# agent_token = "change-me"

# Certificate of the agent daemon, the only trust anchor for the agent
# transport. Generate it on the worker with `rrffmpeg-agent --init DIR --san
# NAME` and copy cert.pem here. Both this key and agent_token are needed, and
# only when a host sets agent_addr.
# agent_cert = "/home/alice/.config/rrffmpeg/worker-cert.pem"

# Journal, pid files and the `coord` slot files. Any local filesystem works: on
# an nvme disk one dispatch costs about 1 ms more than on tmpfs. Keep it off a
# shared or spinning disk, where one fdatasync can cost tens of milliseconds.
# The journal survives a reboot only for the janitor's benefit.
state_dir = "/home/alice/.local/state/rrffmpeg"

# How long one process's "host down" verdict is trusted by the others.
# state_dir must be on a local filesystem, or the slot cap silently falls open.
down_ttl_secs = 60

# Keep one ssh connection per host open this long between jobs. A job then
# opens a channel instead of paying a full handshake. 0 spawns a fresh ssh
# every time.
# ssh_persist_secs = 300

# Where the control sockets go. Defaults to $XDG_RUNTIME_DIR/rffmpeg, else
# /dev/shm/rrffmpeg-<uid>: tmpfs, so a reboot leaves no stale socket.
# ssh_socket_dir = "/run/user/1000/rffmpeg"

# Extra ssh arguments for every host, inserted after the ControlMaster options
# and before the host name. Put a key here, or per host below; `-o` options are
# allowed. They never replace the persistence options.
# ssh_args = ["-o", "StrictHostKeyChecking=yes"]

# Run the local binary when no worker slot frees up within queue_wait_secs.
# Set it to false on a client without a GPU: a failed transcode beats encoding
# in software on the wrong hardware. A local ffprobe still runs either way,
# because it is cheap and Jellyfin needs it for direct-play decisions.
# fallback_local = true

# Variables for the local binary, as a table of strings.
# [local_env]
# LD_LIBRARY_PATH = "/opt/intel/lib"

# Clients that share a worker must share this state_dir, and must not share a
# client_name. Defaults to the hostname.
# client_name = "client"

# Share of a busy worker, 1 to 1000, same scale as the kernel's BFQ IO weight.
# Read only while two clients wait for the same host: a client alone keeps
# taking every slot. 400 here means four starts for one start of a client at
# 100. Job classes still win: a probe goes before a transcode of either client.
# client_weight = 100

[[hosts]]
name = "worker"
concurrency = 2
# What this worker proved it can do. Run `rrffmpeg capabilities worker` on the
# client to print the exact line, one frame per token. An empty list accepts
# any job; every token a job needs must be listed here.
# Tokens: vaapi, vaapi_hevc, vaapi_hevc10, vaapi_av1, vaapi_tonemap,
# vaapi_vpp, qsv, qsv_av1, nvenc, nvenc_av1.
capabilities = ["vaapi", "vaapi_hevc"]

# The roots this host can open, as the host sees them, after its own path maps.
# A job whose input lies under none of them is never placed here, so a title
# that only one machine mounts lands on that machine. Several inputs must all
# be covered. A stream (`http://`, `pipe:0`) is not judged.
# Each root must also stat on the host within 5 s during the janitor probe, so
# a dropped mount marks the host down instead of failing every job.
# Leave it out and the host accepts any input, which is what a config written
# before this key means.
# reads = ["/home/bob/media"]

# Placement preference among otherwise equal hosts: higher wins, default 0.
# It never overrides a missing token, a root the host cannot read, a down host
# or a full host. Use it to say which host to fill first.
# prefer = 0

# Skip ssh for this host and talk to `rrffmpeg-agent` instead. Hosts without
# this line keep using ssh, which needs nothing installed on the worker.
# agent_addr = "worker:9876"

# Run the jobs on this machine instead of a worker. The client's own GPU then
# takes part in placement, so a worker can be reserved for what only it does:
# declare the local GPU here and the AV1 host only with `vaapi_av1`, and AV1
# jobs go to the worker while everything else stays home. The name is then
# only a label for the journal, the slot locks and `--host`. A local host
# takes no paths, no ssh_args and no *_bin: it runs local_ffmpeg and
# local_ffprobe on the client's own paths. One config takes one local host,
# because a machine has one set of slots.
# local = true

# Extra ssh arguments for this host only, appended after the global list. This
# is where a dedicated key goes, so the worker shim only has to set the env.
# ssh_args = ["-i", "/home/alice/.ssh/worker"]

# Variables the worker sets before it runs ffmpeg. They replace the wrapper
# script that exported the OpenCL ICD and the library path by hand.
# [hosts.env]
# OCL_ICD_VENDORS = "/opt/intel/opencl"
# LD_LIBRARY_PATH = "/opt/intel/lib"

# Input: media mounted at a different root on the worker.
# The probe checks every `to` root, so a dead mount marks the host down
# instead of failing each job with ENOENT.
[[hosts.paths]]
from = "/home/alice"
to = "/home/bob/media"

# Output: HLS segments on the client tmpfs, reached through a second mount.
[[hosts.paths]]
from = "/dev/shm/jellyfin-transcode"
to = "/home/bob/transcode"
