# Example config for the production pair.
# Copy to ~/.config/rffmpeg/config.toml, or point RRFFMPEG_CONFIG at it.
#
# Without this file rrffmpeg runs the local ffmpeg and does nothing else.

# Jellyfin on some builds reads probe output on stdout.
stderr_as_stdout = false

# Journal and pid files. Put it on tmpfs if the disk is slow, the journal is
# append-only and survives a reboot only for the janitor's benefit.
state_dir = "/home/alice/.local/state/rrffmpeg"

[[hosts]]
name = "worker"
concurrency = 2
capabilities = ["vaapi"]

# Input: media mounted at a different root on the worker.
[[hosts.paths]]
from = "/home/alice"
to = "/home/bob/media"

# Output: HLS segments on the client tmpfs, reached through a second mount.
[[hosts.paths]]
from = "/dev/shm/jellyfin-transcode"
to = "/home/bob/transcode"
