# Example config for the production pair.
# Copy to ~/.config/rffmpeg/config.toml, or point RRFFMPEG_CONFIG at it.
#
# Without this file rrffmpeg runs the local ffmpeg and does nothing else.

# Jellyfin on some builds reads probe output on stdout.
stderr_as_stdout = false

# Shared secret of the agent daemon. Set it only if a host uses agent_addr.
# RRFFMPEG_AGENT_TOKEN overrides it, which keeps the secret out of this file.
# agent_token = "change-me"

# Certificate of the agent daemon, the only trust anchor for the agent
# transport. Generate it on the worker with `rrffmpeg-agent --init DIR --san
# NAME` and copy cert.pem here. Both this key and agent_token are needed, and
# only when a host sets agent_addr.
# agent_cert = "/home/alice/.config/rrffmpeg/worker-cert.pem"

# Journal, pid files and the `coord` slot files. Put it on tmpfs if the disk is
# slow, the journal is append-only and survives a reboot only for the janitor's
# benefit.
state_dir = "/home/alice/.local/state/rrffmpeg"

# How long one process's "host down" verdict is trusted by the others.
# state_dir must be on a local filesystem, or the slot cap silently falls open.
down_ttl_secs = 60

[[hosts]]
name = "worker"
concurrency = 2
capabilities = ["vaapi"]

# Skip ssh for this host and talk to `rrffmpeg-agent` instead. Hosts without
# this line keep using ssh, which needs nothing installed on the worker.
# agent_addr = "worker:9876"

# Input: media mounted at a different root on the worker.
# The probe checks every `to` root, so a dead mount marks the host down
# instead of failing each job with ENOENT.
[[hosts.paths]]
from = "/home/alice"
to = "/home/bob/media"

# Output: HLS segments on the client tmpfs, reached through a second mount.
[[hosts.paths]]
from = "/dev/shm/jellyfin-transcode"
to = "/home/bob/transcode"
