name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - name: Build
        uses: houseabsolute/actions-rust-cross@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: --release --locked

      - name: Package
        run: |
          name="rrffmpeg-${{ matrix.target }}"
          mkdir -p "$name"
          cp "target/${{ matrix.target }}/release/rrffmpeg" "$name/"
          cp "target/${{ matrix.target }}/release/rrffmpeg-agent" "$name/"
          cp "target/${{ matrix.target }}/release/rrffmpeg-stats" "$name/"
          cp README.md config.example.toml "$name/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Upload to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rrffmpeg-${{ matrix.target }}.tar.gz
            rrffmpeg-${{ matrix.target }}.tar.gz.sha256
          generate_release_notes: true
