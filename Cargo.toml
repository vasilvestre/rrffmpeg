[package]
name = "rrffmpeg"
version = "0.9.0"
edition = "2024"
license = "MIT"

[dependencies]
libc = "0.2.191"
rcgen = "0.14.10"
rustls = { version = "0.23.46", default-features = false, features = ["std", "ring", "logging", "tls12"] }
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
