[package]
name = "rrffmpeg"
version = "0.14.1"
edition = "2024"
license = "MIT"
# Bench targets are listed explicitly below, so a shared harness module under
# benches/harness/ is not mistaken for a sixth target.
autobenches = false

[dependencies]
libc = "0.2.191"
rcgen = "0.14.10"
rustls = { version = "0.23.46", default-features = false, features = ["std", "ring", "logging", "tls12"] }
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"

# The binary starts on every ffmpeg call. Strip the symbols no runtime path
# reads; that is the size win that costs nothing per build. LTO and one codegen
# unit were measured and moved neither startup nor dispatch, so they are out.
[profile.release]
strip = "symbols"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

# Only the five bench targets below run under `cargo bench`. Without this, the
# lib and the bins also run libtest's bench harness, which rejects criterion's
# `--quick` flag.
[lib]
bench = false

[[bin]]
name = "rrffmpeg"
path = "src/main.rs"
bench = false

[[bin]]
name = "rrffmpeg-agent"
path = "src/bin/rrffmpeg-agent.rs"
bench = false

[[bin]]
name = "rrffmpeg-stats"
path = "src/bin/rrffmpeg-stats.rs"
bench = false

[[bench]]
name = "dispatch"
path = "benches/dispatch.rs"
harness = false
test = false

[[bench]]
name = "journal"
path = "benches/journal.rs"
harness = false
test = false

[[bench]]
name = "queue"
path = "benches/queue.rs"
harness = false
test = false

[[bench]]
name = "local"
path = "benches/local.rs"
harness = false
test = false

[[bench]]
name = "progress"
path = "benches/progress.rs"
harness = false
test = false

[[bench]]
name = "scheduler"
path = "benches/scheduler.rs"
harness = false
test = false
